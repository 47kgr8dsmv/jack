name: MORNING
options:
  bundleIdPrefix: com.jack
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
targets:
  MORNING:
    type: application
    platform: iOS
    sources:
      - path: MORNING
        excludes:
          - MORNING.entitlements
    info:
      path: MORNING/Info.plist
      properties:
        CFBundleDisplayName: MORNING
        NSHealthShareUsageDescription: "MORNING 读取你授权的睡眠、心率、呼吸及活动数据，在本机生成每日晨报。"
        UIBackgroundModes: []
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: MORNING/MORNING.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jack.morning
        TARGETED_DEVICE_FAMILY: '1'
        CODE_SIGN_ENTITLEMENTS: MORNING/MORNING.entitlements
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_NSHealthShareUsageDescription: "MORNING 读取授权的 Apple Health 数据，在本机生成晨报。"
        INFOPLIST_KEY_UIApplicationSupportsDocumentBrowser: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
