name: MORNING iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: MORNING-iOS
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate MORNING Xcode project
        run: xcodegen generate --spec project.yml
      - name: Test sleep and report calculations
        run: bash run-model-tests.sh
      - name: Build iOS simulator app (unsigned)
        run: |
          xcodebuild \
            -project MORNING.xcodeproj \
            -scheme MORNING \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
