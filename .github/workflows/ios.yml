name: MORNING iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: MORNING-iOS
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate MORNING Xcode project
        run: xcodegen generate --spec project.yml
      - name: Test sleep and report calculations
        run: bash run-model-tests.sh
      - name: Build iOS simulator app (unsigned)
        run: |
          xcodebuild \
            -project MORNING.xcodeproj \
            -scheme MORNING \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -project MORNING.xcodeproj \
            -scheme MORNING \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build-device \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned device IPA for local sideload signing
        run: |
          set -e
          APP=".build-device/Build/Products/Debug-iphoneos/MORNING.app"
          test -d "$APP"
          mkdir -p ipa/Payload
          ditto "$APP" "ipa/Payload/MORNING.app"
          cd ipa
          /usr/bin/zip -qry ../MORNING-unsigned.ipa Payload
          test -s ../MORNING-unsigned.ipa
      - name: Upload unsigned device IPA
        uses: actions/upload-artifact@v4
        with:
          name: MORNING-unsigned-iphone
          path: MORNING-iOS/MORNING-unsigned.ipa
          retention-days: 7
